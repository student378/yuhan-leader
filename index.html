<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="활동일지">
<link rel="manifest" href="data:application/json,{}">
<title>간부장학생 활동일지</title>
<style>
/* ── 리셋 & 기본 ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;background:#eef2ff;min-height:100vh;min-height:100dvh;overscroll-behavior:none}

/* ── 로딩 ── */
#lo{position:fixed;inset:0;background:rgba(255,255,255,.9);z-index:9999;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.spinner{width:32px;height:32px;border:3px solid #dbeafe;border-top-color:#1d4ed8;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#lo p{font-size:13px;color:#64748b;font-weight:600}

/* ══════════════════════════════
   로그인 화면
══════════════════════════════ */
#loginScreen{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;min-height:100dvh;padding:16px;
  background:linear-gradient(160deg,#1d4ed8 0%,#3b82f6 100%);
}
.lcard{
  background:#fff;border-radius:20px;padding:28px 22px;
  width:100%;max-width:420px;
  box-shadow:0 16px 48px rgba(0,0,0,.22);
}
.llogo{text-align:center;margin-bottom:20px}
.llogo .school{font-size:11px;color:#9ca3af;letter-spacing:2px;margin-bottom:3px}
.llogo .sys{font-size:20px;font-weight:800;color:#1d4ed8}
.llogo .sub{font-size:11px;color:#9ca3af;margin-top:2px}

/* 탭 */
.ltabs{display:flex;margin-bottom:18px;border-radius:10px;overflow:hidden;border:1.5px solid #e5e7eb}
.ltab{flex:1;padding:9px 4px;text-align:center;font-size:12px;font-weight:600;color:#9ca3af;cursor:pointer;background:#fff;transition:all .15s;border:none;font-family:inherit}
.ltab.active{background:#1d4ed8;color:#fff}

/* 폼 */
.fg{margin-bottom:13px}
.fg label{display:block;font-size:12px;font-weight:700;color:#374151;margin-bottom:5px}
.fg input,.fg select{
  width:100%;padding:13px 14px;border:1.5px solid #e5e7eb;border-radius:10px;
  font-size:16px;/* iOS zoom 방지: 16px 이상 */
  outline:none;font-family:inherit;transition:border-color .15s;
  -webkit-appearance:none;appearance:none;
}
.fg input:focus,.fg select:focus{border-color:#1d4ed8;box-shadow:0 0 0 3px rgba(29,78,216,.1)}
.fg .hint{font-size:11px;color:#9ca3af;margin-top:3px}
.btn-login{
  width:100%;padding:15px;background:#1d4ed8;color:#fff;
  border:none;border-radius:11px;font-size:16px;font-weight:700;
  cursor:pointer;font-family:inherit;
  -webkit-appearance:none;
}
.btn-login:active{background:#1e40af}
.err{background:#fef2f2;color:#dc2626;border:1px solid #fecaca;border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:11px;display:none;line-height:1.5}
.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:8px;padding:10px 13px;font-size:13px;margin-bottom:11px;display:none;line-height:1.5}

/* ══════════════════════════════
   앱 화면
══════════════════════════════ */
#appScreen{display:none;min-height:100vh;min-height:100dvh;background:#eef2ff;padding-bottom:calc(64px + env(safe-area-inset-bottom))}

/* 상단 헤더 */
.topbar{
  background:#1d4ed8;color:#fff;
  padding:12px 16px 10px;
  padding-top:calc(12px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
  box-shadow:0 2px 8px rgba(29,78,216,.35);
}
.topbar .t{font-size:15px;font-weight:700;line-height:1.2}
.topbar .u{font-size:11px;opacity:.8;margin-top:2px;line-height:1.2}
.btn-out{
  background:rgba(255,255,255,.2);border:none;color:#fff;
  padding:7px 12px;border-radius:8px;font-size:12px;font-weight:600;
  cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0;
}

/* ── 페이지 ── */
.page{display:none;padding:14px 14px 0}
.page.active{display:block}

/* ── 바텀 네비 ── */
.bnav{
  position:fixed;bottom:0;left:0;right:0;
  display:flex;background:#fff;
  border-top:1px solid #e5e7eb;
  z-index:100;
  padding-bottom:env(safe-area-inset-bottom);
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
}
.ni{
  flex:1;display:flex;flex-direction:column;align-items:center;
  padding:9px 4px 7px;font-size:10px;color:#9ca3af;
  cursor:pointer;transition:color .15s;font-weight:700;
  -webkit-tap-highlight-color:transparent;
  border:none;background:none;font-family:inherit;
}
.ni svg{width:22px;height:22px;margin-bottom:3px}
.ni.active{color:#1d4ed8}

/* ── 카드 ── */
.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.ctitle{font-size:14px;font-weight:700;color:#1e293b;margin-bottom:11px;display:flex;align-items:center;gap:7px}

/* ── 홈 ── */
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.sc{background:#fff;border-radius:12px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.snum{font-size:24px;font-weight:800;color:#1d4ed8}
.slbl{font-size:11px;color:#6b7280;margin-top:2px;font-weight:600}

.irow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid #f3f4f6}
.irow:last-child{border-bottom:none}
.ik{font-size:13px;color:#6b7280}
.iv{font-size:13px;font-weight:600;color:#1e293b;text-align:right;max-width:60%;word-break:keep-all}

/* GAS 상태 */
.gas-bar{display:flex;align-items:center;gap:6px;font-size:11px;padding:6px 10px;border-radius:7px;margin-bottom:10px}
.gas-bar.ok{background:#d1fae5;color:#065f46}
.gas-bar.local{background:#fef3c7;color:#92400e}
.gdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.gdot.ok{background:#22c55e}.gdot.local{background:#f59e0b}

.notice{background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:12px 14px;font-size:12px;color:#92400e;line-height:1.6;margin-bottom:12px}

/* ══════════════════════════════
   작성 폼
══════════════════════════════ */
/* 작성탭 패딩: 바텀바 + 제출버튼 바 높이만큼 */
#pageWrite{padding-bottom:calc(130px + env(safe-area-inset-bottom))}

.frow{display:flex;gap:9px;margin-bottom:10px}
.ffield{flex:1;min-width:0}
.ffield label{font-size:12px;font-weight:700;color:#374151;margin-bottom:4px;display:block}
.ffield input,.ffield select{
  width:100%;padding:11px 12px;border:1.5px solid #e5e7eb;border-radius:9px;
  font-size:16px;/* iOS zoom 방지 */
  outline:none;font-family:inherit;transition:border-color .15s;
  -webkit-appearance:none;
}
.ffield input:focus,.ffield select:focus{border-color:#1d4ed8}
.ffield input[readonly]{background:#f9fafb;color:#6b7280;font-size:14px}

/* 주차 섹션 */
.wsec{margin-bottom:14px}
.wtitle{
  display:flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;color:#1d4ed8;
  margin-bottom:8px;padding:7px 11px;
  background:#eff6ff;border-radius:8px;
}
.wrange{font-size:10px;color:#6b7280;font-weight:400}
.alist{display:flex;flex-direction:column;gap:7px}
.aitem{display:flex;gap:7px;align-items:center}
.aitem input{
  flex:1;padding:12px 13px;border:1.5px solid #e5e7eb;border-radius:9px;
  font-size:16px;/* iOS zoom 방지 */
  outline:none;font-family:inherit;transition:border-color .15s;
}
.aitem input:focus{border-color:#1d4ed8}
.aitem input::placeholder{color:#9ca3af;font-size:14px}
.btn-add,.btn-del{
  width:38px;height:38px;border-radius:9px;border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;
  font-weight:700;
}
.btn-add{background:#dbeafe;color:#1d4ed8}
.btn-del{background:#fee2e2;color:#dc2626}
.btn-add:active,.btn-del:active{opacity:.7}

/* 제출 고정 바 */
.sbar{
  position:fixed;
  bottom:calc(64px + env(safe-area-inset-bottom));
  left:0;right:0;
  background:#fff;border-top:1px solid #e5e7eb;
  padding:10px 14px;
  display:none;gap:9px;z-index:60;
  box-shadow:0 -2px 10px rgba(0,0,0,.08);
}
.sbar.visible{display:flex}
.btn-draft{
  flex:1;padding:13px;background:#f3f4f6;color:#374151;
  border:none;border-radius:10px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.btn-submit{
  flex:2;padding:13px;background:#1d4ed8;color:#fff;
  border:none;border-radius:10px;font-size:14px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.btn-draft:active{background:#e5e7eb}
.btn-submit:active{background:#1e40af}

/* ══════════════════════════════
   제출 내역
══════════════════════════════ */
.hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.hist-header-title{font-size:14px;font-weight:700;color:#1e293b}
.btn-sync{
  display:inline-flex;align-items:center;gap:4px;
  padding:7px 12px;background:#dbeafe;color:#1d4ed8;
  border:none;border-radius:8px;font-size:12px;font-weight:700;
  cursor:pointer;font-family:inherit;
}
.hitem{border:1.5px solid #e5e7eb;border-radius:12px;padding:13px;margin-bottom:9px;cursor:pointer;transition:border-color .15s;background:#fff}
.hitem:active{border-color:#1d4ed8;background:#f8faff}
.hhead{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:5px;gap:8px}
.htitle{font-size:14px;font-weight:700;color:#1e293b;line-height:1.3}
.hmeta{font-size:11px;color:#6b7280;line-height:1.5}
.hcomment{margin-top:7px;font-size:12px;color:#1d4ed8;background:#eff6ff;border-radius:6px;padding:6px 9px;line-height:1.5}

/* ── 뱃지 ── */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700;white-space:nowrap}
.b-blue{background:#dbeafe;color:#1d4ed8}
.b-yellow{background:#fef3c7;color:#92400e}
.b-green{background:#d1fae5;color:#065f46}
.b-red{background:#fee2e2;color:#991b1b}
.b-gray{background:#f3f4f6;color:#6b7280}

/* ── 모달 (바텀시트) ── */
.modal-bg{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-bg.open{opacity:1;pointer-events:all}
.modal{
  background:#fff;border-radius:20px 20px 0 0;padding:20px 18px;
  padding-bottom:calc(20px + env(safe-area-inset-bottom));
  width:100%;max-width:520px;max-height:88vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s;
}
.modal-bg.open .modal{transform:translateY(0)}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.mtitle{font-size:16px;font-weight:700}
.btn-x{background:#f3f4f6;border:none;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}

/* ── 상세 내용 ── */
.det-week-title{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#1d4ed8;margin:10px 0 6px;padding:6px 10px;background:#eff6ff;border-radius:7px}
.det-act{padding:4px 0 4px 11px;font-size:13px;color:#374151;line-height:1.6}

/* ── 프로필 ── */
.prof-pw-section{margin-top:4px}

/* ── 토스트 ── */
.toast{
  position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));
  left:50%;transform:translateX(-50%);
  background:#1e293b;color:#fff;padding:11px 22px;border-radius:22px;
  font-size:13px;font-weight:700;z-index:999;
  opacity:0;pointer-events:none;transition:opacity .25s;
  white-space:nowrap;max-width:90vw;text-align:center;
}
.toast.show{opacity:1}

/* ── 이름 자동완성 드롭다운 ── */
#rName:focus + #nameDropdown,
#nameDropdown:not([style*="display: none"]){
  /* 드롭다운 표시 중일 때 이름 input 하단 radius 제거 */
}
.name-input-open{border-radius:10px 10px 0 0!important;border-bottom-color:#1d4ed8!important}
#nameDropdown{border-top:none}

/* ── 빈 상태 ── */
.empty-state{text-align:center;padding:40px 20px;color:#9ca3af}
.empty-state .emo{font-size:36px;margin-bottom:10px}
.empty-state p{font-size:13px;line-height:1.6}

@media print{.bnav,.sbar,.topbar,.btn-x,.btn-sync,.no-print{display:none!important}}
</style>
</head>
<body>

<div id="lo" style="display:none"><div class="spinner"></div><p id="lmsg">처리 중...</p></div>

<!-- ══ 로그인 화면 ══ -->
<div id="loginScreen">
  <div class="lcard">
    <div class="llogo">
      <div class="school">유한대학교</div>
      <div class="sys">📋 간부장학생 활동일지</div>
      <div class="sub">학생용 시스템</div>
    </div>
    <div class="ltabs">
      <button class="ltab active" onclick="switchLTab('login')">로그인</button>
      <button class="ltab" onclick="switchLTab('reg')">회원가입</button>
      <button class="ltab" onclick="switchLTab('pw')">비번변경</button>
    </div>

    <!-- 로그인 -->
    <div id="fLogin">
      <div id="loginErr" class="err"></div>
      <div class="fg">
        <label>학번 (아이디)</label>
        <input id="loginId" type="text" placeholder="예: 202510029" maxlength="12" inputmode="numeric" autocomplete="username">
      </div>
      <div class="fg">
        <label>비밀번호</label>
        <input id="loginPw" type="password" placeholder="비밀번호 입력" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
      </div>
      <button class="btn-login" onclick="doLogin()">로그인</button>
    </div>

    <!-- 회원가입 -->
    <div id="fReg" style="display:none">
      <div id="regErr" class="err"></div>
      <div id="regOk" class="ok"></div>

      <div class="fg"><label>학번 (아이디)</label>
        <input id="rId" type="text" placeholder="예: 202510029" maxlength="12" inputmode="numeric">
        <div class="hint">학번이 로그인 ID로 사용됩니다</div>
      </div>

      <div class="fg"><label>이름</label>
        <input id="rName" type="text" placeholder="본인 이름 입력" autocomplete="name" oninput="onNameInput()" autocomplete="off">
        <!-- 이름 검색 결과 드롭다운 -->
        <div id="nameDropdown" style="display:none;border:1.5px solid #1d4ed8;border-top:none;border-radius:0 0 10px 10px;background:#fff;max-height:180px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);position:relative;z-index:10"></div>
      </div>

      <!-- 자동완성된 정보 표시 카드 -->
      <div id="autoFilledCard" style="display:none;background:#eff6ff;border:1.5px solid #93c5fd;border-radius:10px;padding:11px 14px;margin-bottom:13px">
        <div style="font-size:11px;font-weight:700;color:#1d4ed8;margin-bottom:7px">✅ 명단에서 자동으로 불러왔습니다</div>
        <div id="autoFilledInfo" style="font-size:13px;color:#1e293b;line-height:1.8"></div>
      </div>

      <!-- 명단 미등록시 수동 입력 -->
      <div id="manualFields" style="display:none">
        <div style="background:#fef3c7;border:1px solid #fde68a;border-radius:8px;padding:9px 12px;margin-bottom:12px;font-size:12px;color:#92400e">
          ⚠️ 명단에서 찾을 수 없습니다. 직접 입력하거나 관리자에게 문의하세요.
        </div>
        <div class="fg"><label>학과(전공)</label><input id="rDept" type="text" placeholder="예: 식품영양학과"></div>
        <div class="fg"><label>소속 단체</label>
          <select id="rOrg"><option value="">선택하세요</option><option>학생자치위원회</option><option>대의원회</option><option>과대표</option></select>
        </div>
        <div class="fg"><label>직위</label><input id="rPos" type="text" placeholder="예: 위원장, 과대표"></div>
      </div>

      <!-- 숨김 필드 (자동완성값 저장) -->
      <input id="rDeptHidden" type="hidden">
      <input id="rOrgHidden" type="hidden">
      <input id="rPosHidden" type="hidden">

      <div class="fg"><label>비밀번호 (8자 이상)</label><input id="rPw" type="password" placeholder="영문+숫자 혼합 권장" autocomplete="new-password"></div>
      <div class="fg"><label>비밀번호 확인</label><input id="rPw2" type="password" placeholder="비밀번호 재입력" autocomplete="new-password"></div>
      <button class="btn-login" onclick="doRegister()">가입하기</button>
    </div>

    <!-- 비번 변경 -->
    <div id="fPw" style="display:none">
      <div id="pwErr" class="err"></div>
      <div id="pwOk" class="ok"></div>
      <div class="fg"><label>학번</label><input id="pId" type="text" placeholder="학번 입력" inputmode="numeric"></div>
      <div class="fg"><label>현재 비밀번호</label><input id="pOld" type="password" placeholder="현재 비밀번호"></div>
      <div class="fg"><label>새 비밀번호</label><input id="pNew" type="password" placeholder="8자 이상"></div>
      <div class="fg"><label>새 비밀번호 확인</label><input id="pNew2" type="password" placeholder="재입력"></div>
      <button class="btn-login" onclick="doChangePwLogin()">비밀번호 변경</button>
    </div>
  </div>
</div>

<!-- ══ 앱 화면 ══ -->
<div id="appScreen">
  <div class="topbar">
    <div>
      <div class="t">📋 간부장학생 활동일지</div>
      <div class="u" id="hUser"></div>
    </div>
    <button class="btn-out" onclick="doLogout()">로그아웃</button>
  </div>

  <!-- 홈 탭 -->
  <div class="page active" id="pageHome">
    <div id="gasBar" class="gas-bar local"><div class="gdot local"></div><span id="gasBarTxt">GAS URL 미설정 – 로컬 모드</span></div>
    <div class="sgrid">
      <div class="sc"><div class="snum" id="sTotal">0</div><div class="slbl">총 제출</div></div>
      <div class="sc"><div class="snum" id="sPend" style="color:#f59e0b">0</div><div class="slbl">승인 대기</div></div>
      <div class="sc"><div class="snum" id="sAppr" style="color:#22c55e">0</div><div class="slbl">승인 완료</div></div>
      <div class="sc"><div class="snum" id="sDraft" style="color:#6b7280">0</div><div class="slbl">임시저장</div></div>
    </div>
    <div class="card">
      <div class="ctitle">👤 내 정보</div>
      <div id="myInfo"></div>
    </div>
    <div class="notice">
      ⚠️ <strong>제출 안내</strong><br>
      활동일지는 매월 말 학생자치위원회 및 학생장협의회 정기회의 때 일괄 수합하여 학생복지팀으로 제출합니다.
    </div>
  </div>

  del(k){try{localStorage.removeItem('yuhan_jang_'+k);}catch{}}
};

// ══ GAS JSONP ══
function gasCall(params,cb){
  const url=localStorage.getItem(GAS_URL_KEY)||'';
  if(!url){cb(null,'GAS URL 미설정');return;}
  const name='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2);
  const sc=document.createElement('script');
  const timer=setTimeout(()=>{delete window[name];sc.remove();cb(null,'timeout');},12000);
  window[name]=d=>{clearTimeout(timer);delete window[name];sc.remove();cb(d,null);};
  sc.src=url+'?'+new URLSearchParams({...params,callback:name});
  sc.onerror=()=>{clearTimeout(timer);delete window[name];cb(null,'network error');};
  document.body.appendChild(sc);
}

// ══ 주차 계산 ══
function getWeeks(year,month){
  const weeks=[],last=new Date(year,month,0).getDate();
  let cur=1,w=1;
  while(cur<=last&&w<=6){
    const dow=new Date(year,month-1,cur).getDay();
    const end=Math.min(cur+(6-dow),last);
    weeks.push({label:w+'주차',start:cur,end,range:`${month}/${cur}~${month}/${end}`});
    cur=end+1;w++;
  }
  return weeks;
}

// localStorage에 저장된 명단이 있으면 병합해서 사용 (admin에서 추가한 것도 반영)
function getAllMembers(){
  const stored=S.get('members');
  if(!stored) return DEF_MEMBERS;
  // stored에 없는 기본 멤버도 포함 (병합)
  const merged={};
  Object.keys(DEF_MEMBERS).forEach(org=>{
    const base=DEF_MEMBERS[org];
    const extra=(stored[org]||[]).filter(m=>!base.some(b=>b.name===m.name));
    merged[org]=[...base,...extra];
  });
  return merged;
}

// 전체 명단을 플랫 배열로
function flatMembers(){
  const all=getAllMembers();
  return Object.keys(all).flatMap(org=>all[org].map(m=>({...m,org})));
}

function onNameInput(){
  const q=document.getElementById('rName').value.trim();
  const nameInp=document.getElementById('rName');

  hideAutoFilled();

  if(!q){
    closeDropdown();
    hideManualFields();
    return;

  const results=flatMembers().filter(m=>m.name.includes(q));
  const dd=document.getElementById('nameDropdown');
  nameInp.classList.add('name-input-open');

  if(!results.length){
    // 일치 없음 → 수동 입력 안내
    dd.innerHTML=`<div style="padding:12px 14px;font-size:12px;color:#94a3b8;text-align:center">일치하는 간부 없음 — 직접 입력</div>`;
    dd.style.display='block';
    showManualFields();
    return;
  }

  dd.style.display='block';
  dd.innerHTML=results.map((m,i)=>`
    <div
      onclick="selectMember(${i})"
      data-idx="${i}"
      style="padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center;transition:background .1s"
      onmouseover="this.style.background='#eff6ff'"
      onmouseout="this.style.background=''"
    >

        <div style="font-size:11px;color:#64748b;margin-top:2px">${m.dept}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:11px;font-weight:700;color:#1d4ed8">${m.org}</div>
        <div style="font-size:11px;color:#64748b">${m.position}</div>
      </div>
    </div>`).join('');

  // 저장용 데이터 임시 주입
  dd.querySelectorAll('[data-idx]').forEach((el,i)=>{
    el.addEventListener('click',()=>selectMemberByData(results[i]));
  });
  dd.innerHTML=''; // 이벤트 방식으로 재구성
  results.forEach((m)=>{
    const div=document.createElement('div');
    div.style.cssText='padding:11px 14px;cursor:pointer;border-bottom:1px solid #f1f5f9;display:flex;justify-content:space-between;align-items:center';
    div.innerHTML=`
      <div>
        <div style="font-size:14px;font-weight:700;color:#1e293b">${m.name}</div>

function selectMemberByData(m){

// ══ 회원가입 ══
function doRegister(){
  const id=v('rId');
  const name=v('rName');
  const pw=v('rPw');
  const pw2=v('rPw2');

  // 자동완성 우선, 없으면 수동 입력값 사용
  const dept=document.getElementById('rDeptHidden').value.trim()
           || document.getElementById('rDept')?.value?.trim() || '';
  const org=document.getElementById('rOrgHidden').value.trim()
          || document.getElementById('rOrg')?.value?.trim() || '';
  const pos=document.getElementById('rPosHidden').value.trim()
          || document.getElementById('rPos')?.value?.trim() || '';

  if(!id)         return showE('regErr','학번을 입력해주세요.');
  if(!name)       return showE('regErr','이름을 입력해주세요.');
  if(!/^\d{9,12}$/.test(id)) return showE('regErr','학번 형식이 맞지 않습니다 (숫자 9~12자리).');
  if(!dept||!org||!pos){
    if(!_autoSelected){
      // 이름 입력 후 명단에서 선택하지 않았고 수동 입력도 없음
      return showE('regErr','이름을 입력한 후 목록에서 선택하거나, 정보를 직접 입력해주세요.');
    }
    return showE('regErr','학과·소속·직위 정보를 확인해주세요.');
  }
  if(pw.length<8) return showE('regErr','비밀번호는 8자 이상이어야 합니다.');
  if(pw!==pw2)    return showE('regErr','비밀번호가 일치하지 않습니다.');

  const users=getUsers();
  if(users[id])   return showE('regErr','이미 가입된 학번입니다.');

  const user={id,name,dept,org,position:pos,pw:btoa(unescape(encodeURIComponent(pw))),joinedAt:new Date().toISOString()};
  users[id]=user; saveUsers(users);

  if(GAS_OK()) gasCall({action:'registerUser',id,name,dept,org,position:pos},()=>{});

  showOk('regOk','✅ 가입 완료! 로그인 탭에서 로그인하세요.');
  // 초기화
  ['rId','rPw','rPw2'].forEach(i=>document.getElementById(i).value='');
  document.getElementById('rName').value='';
  hideAutoFilled(); hideManualFields(); closeDropdown();
  _autoSelected=null;
}

  const id=v('pId'),old=v('pOld'),nw=v('pNew'),nw2=v('pNew2');
  const users=getUsers();
  if(!users[id])return showE('pwErr','등록되지 않은 학번입니다.');
  if(users[id].pw!==btoa(unescape(encodeURIComponent(old))))return showE('pwErr','현재 비밀번호가 올바르지 않습니다.');
  if(nw.length<8)return showE('pwErr','새 비밀번호는 8자 이상이어야 합니다.');
  if(nw!==nw2)return showE('pwErr','새 비밀번호가 일치하지 않습니다.');
  users[id].pw=btoa(unescape(encodeURIComponent(nw)));
  saveUsers(users);
  showOk('pwOk','✅ 비밀번호가 변경되었습니다.');
}

// ══ 앱 진입 ══
function enterApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('hUser').textContent=CU.name+' · '+CU.org+' '+CU.position;
  updateGasBar();
  renderHome();
  initWriteForm();
  renderHist();
  renderProf();
}

function updateGasBar(){
  const bar=document.getElementById('gasBar');
  const txt=document.getElementById('gasBarTxt');
  const dot=bar.querySelector('.gdot');
  const ok=GAS_OK();
  bar.className='gas-bar '+(ok?'ok':'local');
  dot.className='gdot '+(ok?'ok':'local');
  txt.textContent=ok?'Google Sheets 연동 활성화':'로컬 모드 (관리자 페이지에서 GAS URL 설정 후 연동)';
}

// ══ 탭 전환 ══
function gp(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(n=>n.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(el)el.classList.add('active');
  document.getElementById('sbar').classList.toggle('visible',id==='pageWrite');
  if(id==='pageHist')renderHist();
  // 스크롤 최상단
  window.scrollTo(0,0);
}

// ══ 홈 ══
function renderHome(){
  const js=getJournals().filter(j=>j.studentId===CU.id);
  document.getElementById('sTotal').textContent=js.filter(j=>j.status!=='draft').length;
  document.getElementById('sPend').textContent=js.filter(j=>j.status==='submitted').length;
  document.getElementById('sAppr').textContent=js.filter(j=>j.status==='approved').length;
  document.getElementById('sDraft').textContent=js.filter(j=>j.status==='draft').length;
  document.getElementById('myInfo').innerHTML=`
    <div class="irow"><span class="ik">학번</span><span class="iv">${CU.id}</span></div>
    <div class="irow"><span class="ik">이름</span><span class="iv">${CU.name}</span></div>
    <div class="irow"><span class="ik">학과</span><span class="iv">${CU.dept}</span></div>
    <div class="irow"><span class="ik">소속</span><span class="iv">${CU.org}</span></div>
    <div class="irow"><span class="ik">직위</span><span class="iv">${CU.position}</span></div>`;
}

// ══ 작성 폼 초기화 ══
function initWriteForm(){
  const now=new Date();
  document.getElementById('wYear').value=now.getFullYear()+'년도';
  document.getElementById('wMonth').value=now.getMonth()+1;
  document.getElementById('wSid').value=CU.id;
  document.getElementById('wName').value=CU.name;
  document.getElementById('wDept').value=CU.dept;
  document.getElementById('wOrg').value=CU.org;
  document.getElementById('wPos').value=CU.position;
  renderWeekSecs();
  loadDraft();
}
function onMonthChange(){renderWeekSecs();loadDraft();}
function renderWeekSecs(){
  const month=parseInt(document.getElementById('wMonth').value);
  const year=new Date().getFullYear();
  const weeks=getWeeks(year,month);
  document.getElementById('weekSecs').innerHTML=weeks.map((w,wi)=>`
    <div class="wsec">
      <div class="wtitle">📅 ${w.label} <span class="wrange">${w.range}</span></div>
      <div class="alist" id="wl_${wi}">
        <div class="aitem">
          <input type="text" placeholder="● 활동 내용을 입력하세요" data-week="${wi}" inputmode="text" enterkeyhint="next">
          <button class="btn-add" onclick="addRow(${wi})">＋</button>
        </div>
      </div>
    </div>`).join('');
}
function addRow(wi){
  const list=document.getElementById('wl_'+wi);
  const div=document.createElement('div');
  div.className='aitem';
  div.innerHTML=`<input type="text" placeholder="● 활동 내용 입력" data-week="${wi}" inputmode="text" enterkeyhint="next"><button class="btn-del" onclick="this.parentElement.remove()">－</button>`;
  list.appendChild(div);
  // 키보드가 올라온 뒤 포커스
  setTimeout(()=>div.querySelector('input').focus(),100);
}
function collectActs(){
  const d={};
  document.querySelectorAll('[data-week]').forEach(inp=>{
    const w=inp.dataset.week;if(!d[w])d[w]=[];
    if(inp.value.trim())d[w].push(inp.value.trim());
  });
  return d;
}
function fillActs(data){
  Object.keys(data).forEach(wi=>{
    const list=document.getElementById('wl_'+wi);if(!list)return;
    const vals=data[wi]||[];if(!vals.length)return;
    const inputs=list.querySelectorAll('input');
    vals.forEach((val,i)=>{
      if(i<inputs.length){inputs[i].value=val;}
      else{addRow(parseInt(wi));const ins=list.querySelectorAll('input');if(ins[i])ins[i].value=val;}
    });
  });
}

// ══ 임시저장 ══
function saveDraft(){
  const month=document.getElementById('wMonth').value;
  S.set('draft_'+CU.id+'_'+month,{month,acts:collectActs(),at:new Date().toISOString()});
  showToast('💾 임시저장 완료');
}
function loadDraft(){
  const month=document.getElementById('wMonth').value;
  const d=S.get('draft_'+CU.id+'_'+month);
  if(d&&d.acts)setTimeout(()=>fillActs(d.acts),80);
}

// ══ 제출 ══
function submitJournal(){
  const month=parseInt(document.getElementById('wMonth').value);
  const year=new Date().getFullYear();
  const acts=collectActs();
  if(!Object.values(acts).some(a=>a.length>0)){showToast('❗ 활동 내용을 1건 이상 입력해주세요.');return;}
  const journals=getJournals();
  const dup=journals.find(j=>j.studentId===CU.id&&j.year===year&&j.month===month&&j.status!=='draft');
  if(dup){showToast(month+'월 활동일지는 이미 제출되었습니다.');return;}
  const weeks=getWeeks(year,month);
  const journal={
    id:'J'+Date.now(),
    studentId:CU.id,studentName:CU.name,dept:CU.dept,org:CU.org,position:CU.position,
    year,month,
    weeks:weeks.map((w,i)=>({...w,activities:acts[i]||[]})),
    status:'submitted',submittedAt:new Date().toISOString(),
    approvedAt:null,approvedBy:'',comment:'',synced:false
  };
  showLoading('제출 중...');
  function afterSave(){
    journals.push(journal);saveJournals(journals);
    S.del('draft_'+CU.id+'_'+month);
    hideLoading();
    showToast('✅ 제출 완료!');
    renderHome();renderHist();
    gp('pageHist',document.querySelectorAll('.ni')[2]);
  }
  if(GAS_OK()){
    gasCall({action:'submitJournal',data:JSON.stringify(journal)},(res,err)=>{
      if(!err&&res&&res.ok)journal.synced=true;
      afterSave();
    });
  }else afterSave();
}

// ══ 서버 동기화 ══
function syncJournals(){
  if(!GAS_OK()){showToast('GAS URL이 설정되지 않았습니다.');return;}
  const ico=document.getElementById('syncIco');
  ico.style.animation='spin .7s linear infinite';
  gasCall({action:'getMyJournals',studentId:CU.id},(res,err)=>{
    ico.style.animation='';
    if(err||!res){showToast('동기화 실패: '+(err||'오류'));return;}
    const all=getJournals().filter(j=>j.studentId!==CU.id);
    const merged=[...all,...(res.journals||[])];
    saveJournals(merged);
    renderHist();renderHome();
    showToast('✅ 동기화 완료 ('+(res.journals||[]).length+'건)');
  });
}

// ══ 내역 렌더링 ══
function renderHist(){
  const list=getJournals()
    .filter(j=>j.studentId===CU.id&&j.status!=='draft')
    .sort((a,b)=>new Date(b.submittedAt)-new Date(a.submittedAt));
  const c=document.getElementById('histList');
  if(!list.length){
    c.innerHTML=`<div class="empty-state"><div class="emo">📭</div><p>제출된 활동일지가 없습니다<br>작성 탭에서 활동일지를 작성해주세요</p></div>`;
    return;
  }
  c.innerHTML=list.map(j=>`
    <div class="hitem" onclick="viewDet('${j.id}')">
      <div class="hhead">
        <div class="htitle">${j.year}년 ${j.month}월 활동일지</div>
        ${sbadge(j.status)}
      </div>
      <div class="hmeta">${j.org} · ${j.position}<br>제출: ${fdt(j.submittedAt)}${j.approvedAt?' · 팀장승인: '+fdt(j.approvedAt):''}${j.synced===false?' · 🔶미동기':''}
      </div>
      ${j.comment?`<div class="hcomment">💬 ${j.comment}</div>`:''}
    </div>`).join('');
}

// ══ 상세 보기 ══
function viewDet(jid){
  const j=getJournals().find(x=>x.id===jid);if(!j)return;
  document.getElementById('detTitle').textContent=j.year+'년 '+j.month+'월 활동일지';
  document.getElementById('detContent').innerHTML=`
    <div style="margin-bottom:10px;display:flex;gap:7px;align-items:center;flex-wrap:wrap">${sbadge(j.status)}
      ${j.approvedBy?`<span style="font-size:11px;color:#64748b">팀장: ${j.approvedBy}</span>`:''}
    </div>
    <div class="irow"><span class="ik">학번</span><span class="iv">${j.studentId||'-'}</span></div>
    <div class="irow"><span class="ik">이름</span><span class="iv">${j.studentName}</span></div>
    <div class="irow"><span class="ik">학과</span><span class="iv">${j.dept}</span></div>
    <div class="irow"><span class="ik">소속</span><span class="iv">${j.org} · ${j.position}</span></div>
    <div class="irow"><span class="ik">제출일</span><span class="iv">${fdt(j.submittedAt)}</span></div>
    ${j.approvedAt?`<div class="irow"><span class="ik">팀장승인</span><span class="iv">${fdt(j.approvedAt)}</span></div>`:''}
    <hr style="border:none;border-top:1px solid #e5e7eb;margin:10px 0">
    ${(j.weeks||[]).map(w=>`
      <div class="det-week-title">📅 ${w.label} <span style="font-size:10px;color:#6b7280;font-weight:400;margin-left:4px">${w.range}</span></div>
      ${(w.activities||[]).length?w.activities.map(a=>`<div class="det-act">● ${a}</div>`).join(''):'<div style="font-size:12px;color:#94a3b8;padding-left:10px">활동 내용 없음</div>'}
      <div style="height:6px"></div>`).join('')}
    ${j.comment?`<div style="font-size:13px;color:#dc2626;background:#fef2f2;border-radius:7px;padding:9px 11px;margin-top:4px">💬 ${j.comment}</div>`:''}`;
  document.getElementById('detModal').classList.add('open');
}
function closeMod(e){if(e.target===document.getElementById('detModal'))closeModDir();}
function closeModDir(){document.getElementById('detModal').classList.remove('open');}

// ══ 프로필 ══
function renderProf(){
  document.getElementById('profInfo').innerHTML=`
    <div class="irow"><span class="ik">학번</span><span class="iv">${CU.id}</span></div>
    <div class="irow"><span class="ik">이름</span><span class="iv">${CU.name}</span></div>
    <div class="irow"><span class="ik">학과</span><span class="iv">${CU.dept}</span></div>
    <div class="irow"><span class="ik">소속</span><span class="iv">${CU.org}</span></div>
    <div class="irow"><span class="ik">직위</span><span class="iv">${CU.position}</span></div>
    <div class="irow"><span class="ik">가입일</span><span class="iv">${fdt(CU.joinedAt)}</span></div>`;
}
function changePwApp(){
  const old=document.getElementById('pOldIn').value;
  const nw=document.getElementById('pNewIn').value;
  const nw2=document.getElementById('pNew2In').value;
  if(CU.pw!==btoa(unescape(encodeURIComponent(old)))){showToast('현재 비밀번호 오류');return;}
  if(nw.length<8){showToast('8자 이상 입력해주세요');return;}
  if(nw!==nw2){showToast('새 비밀번호가 일치하지 않습니다');return;}
  const users=getUsers();
  users[CU.id].pw=btoa(unescape(encodeURIComponent(nw)));
  saveUsers(users);CU.pw=users[CU.id].pw;
  ['pOldIn','pNewIn','pNew2In'].forEach(id=>document.getElementById(id).value='');
  showToast('✅ 비밀번호 변경 완료');
}

// ══ 유틸 ══
function v(id){return(document.getElementById(id).value||'').trim();}
function fdt(iso){if(!iso)return '-';const d=new Date(iso);return d.getFullYear()+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+String(d.getDate()).padStart(2,'0');}
function sbadge(s){
  if(s==='submitted')return '<span class="badge b-yellow">승인대기</span>';
  if(s==='approved') return '<span class="badge b-green">팀장승인</span>';
  if(s==='rejected') return '<span class="badge b-red">반려</span>';
  return '<span class="badge b-gray">임시저장</span>';
}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2700);}
function showLoading(m){document.getElementById('lmsg').textContent=m||'';document.getElementById('lo').style.display='flex';}
function hideLoading(){document.getElementById('lo').style.display='none';}

// ══ 자동 로그인 복원 ══
(function init(){
  const sess=S.get('session');
  if(sess&&sess.id){const u=getUsers()[sess.id];if(u){CU=u;enterApp();return;}}
})();
</script>
